name: LJN monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch: {}       # "Run workflow" button for a manual check

concurrency:
  group: ljn-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run one check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_PAUSED: ${{ vars.BOT_PAUSED }}
        run: python -m monitor.main
      - name: Save state and dashboard
        run: |
          git config user.name "ljn-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "monitor: update state [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1
